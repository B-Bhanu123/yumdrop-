apiVersion: v1
kind: Namespace
metadata:
  name: yumdrop-cluster
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: yumdrop-cluster
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: yumdrop/api-gateway:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: yumdrop-cluster
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: api-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-auth-service
  namespace: yumdrop-cluster
spec:
  replicas: 2
  selector:
