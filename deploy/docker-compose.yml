version: '3.8'

services:
  api-gateway:
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user-auth-service:3001
      - RESTAURANT_SERVICE_URL=http://restaurant-catalog-service:3002
      - ORDER_SERVICE_URL=http://order-dispatch-service:3003
      - PAYMENT_SERVICE_URL=http://payment-billing-service:3004
      - NOTIFICATION_SERVICE_URL=http://notification-service:3005
      - ANALYTICS_SERVICE_URL=http://analytics-service:3006
    depends_on:
      - user-auth-service
      - restaurant-catalog-service
      - order-dispatch-service
      - payment-billing-service
      - notification-service
      - analytics-service

  user-auth-service:
    build:
      context: ..
      dockerfile: services/user-auth-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      - PORT=3001

  restaurant-catalog-service:
    build:
      context: ..
      dockerfile: services/restaurant-catalog-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      - PORT=3002

  order-dispatch-service:
    build:
      context: ..
      dockerfile: services/order-dispatch-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      - PORT=3003

  payment-billing-service:
    build:
      context: ..
      dockerfile: services/payment-billing-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      - PORT=3004

  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      - PORT=3005

  analytics-service:
    build:
      context: ..
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      - PORT=3006
